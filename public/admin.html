<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - RobloxShop</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#090b10;color:#f5f7fb;font-family:Inter,system-ui,sans-serif}.card{background:#11151d;border:1px solid #252b36;border-radius:16px}.form-control{background:#0c1017;color:#fff;border-color:#303746}.form-control:focus{background:#0c1017;color:#fff;border-color:#5865f2;box-shadow:0 0 0 .2rem #5865f233}.muted{color:#8c95a5}.service{border-bottom:1px solid #252b36;padding:18px 0}.service:last-child{border:0}.price{font-size:18px;font-weight:800}</style></head><body>
<nav class="navbar navbar-dark bg-dark border-bottom"><div class="container"><a class="navbar-brand fw-bold" href="/">ROBLOX<span style="color:#7280ff">SHOP</span> ADMIN</a><div><a class="btn btn-outline-light btn-sm" href="/">Trang chủ</a> <button class="btn btn-danger btn-sm" onclick="logout()">Đăng xuất</button></div></div></nav>
<main class="container py-4"><div id="alert"></div><div class="card p-4 mb-4"><h3>Quản lý dịch vụ cày thuê</h3><p class="muted mb-0">Thêm, sửa, ẩn/hiện hoặc xóa dịch vụ trực tiếp.</p></div>
<div class="card p-4 mb-4"><h4 id="formTitle">Thêm dịch vụ</h4><input type="hidden" id="id"><div class="row g-3"><div class="col-md-4"><label class="form-label">Game</label><input id="game" class="form-control" placeholder="Blox Fruits"></div><div class="col-md-8"><label class="form-label">Tên dịch vụ</label><input id="title" class="form-control" placeholder="Cày level"></div><div class="col-12"><label class="form-label">Mô tả</label><textarea id="description" class="form-control" rows="3"></textarea></div><div class="col-md-4"><label class="form-label">Giá VNĐ</label><input id="price" type="number" min="0" class="form-control" placeholder="50000"></div><div class="col-md-4"><label class="form-label">Thời gian</label><input id="eta" class="form-control" placeholder="1-2 ngày"></div><div class="col-md-4 d-flex align-items-end"><div class="form-check mb-2"><input id="active" class="form-check-input" type="checkbox" checked><label class="form-check-label">Đang hiển thị</label></div></div></div><div class="mt-3"><button class="btn btn-primary" onclick="saveService()">Lưu</button> <button class="btn btn-secondary" onclick="resetForm()">Nhập mới</button></div></div>
<div class="card p-4"><div class="d-flex justify-content-between align-items-center mb-2"><h4 class="mb-0">Danh sách dịch vụ</h4><button class="btn btn-outline-light btn-sm" onclick="load()">Làm mới</button></div><div id="list">Đang tải...</div></div></main>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const money=n=>new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND'}).format(Number(n)||0);
function msg(t,type='success'){alert.innerHTML=`<div class="alert alert-${type}">${esc(t)}</div>`;setTimeout(()=>alert.innerHTML='',3000)}
async function check(){const r=await fetch('/api/me'),d=await r.json();if(!d.user){location='/login.html';return false}if(!d.user.is_admin){alert('Tài khoản không có quyền admin.');location='/';return false}return true}
async function load(){const r=await fetch('/api/admin/services'),d=await r.json();if(!r.ok){msg(d.error||'Không tải được dịch vụ.','danger');return}list.innerHTML=d.services.length?d.services.map(s=>`<div class="service"><div class="row g-3 align-items-center"><div class="col-lg-8"><div class="text-primary fw-bold">${esc(s.game)}</div><h5>${esc(s.title)}</h5><div class="muted">${esc(s.description)}</div><div class="mt-2"><span class="price">${money(s.price)}</span> <span class="muted ms-2">${esc(s.eta)}</span> <span class="badge ${Number(s.active)?'text-bg-success':'text-bg-secondary'} ms-2">${Number(s.active)?'Đang hiện':'Đang ẩn'}</span></div></div><div class="col-lg-4 text-lg-end"><button class="btn btn-primary btn-sm" onclick='edit(${JSON.stringify(s)})'>Sửa</button> <button class="btn btn-warning btn-sm" onclick="toggle(${s.id},${Number(s.active)?0:1})">${Number(s.active)?'Ẩn':'Hiện'}</button> <button class="btn btn-danger btn-sm" onclick="del(${s.id})">Xóa</button></div></div></div>`).join(''):'<div class="muted">Chưa có dịch vụ.</div>'}
function edit(s){id.value=s.id;game.value=s.game;title.value=s.title;description.value=s.description;price.value=s.price;eta.value=s.eta;active.checked=Number(s.active)===1;formTitle.textContent='Sửa dịch vụ #'+s.id;scrollTo({top:0,behavior:'smooth'})}
function resetForm(){['id','game','title','description','price','eta'].forEach(x=>$(x).value='');active.checked=true;formTitle.textContent='Thêm dịch vụ'}
async function saveService(){const sid=id.value;const body={game:game.value,title:title.value,description:description.value,price:Number(price.value),eta:eta.value,active:active.checked};const r=await fetch(sid?'/api/admin/services/'+sid:'/api/admin/services',{method:sid?'PATCH':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok){msg(d.error||'Lưu thất bại.','danger');return}msg(sid?'Đã cập nhật dịch vụ.':'Đã thêm dịch vụ.');resetForm();load()}
async function toggle(sid,a){const r=await fetch('/api/admin/services/'+sid,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({active:!!a})}),d=await r.json();if(!r.ok){msg(d.error||'Cập nhật thất bại.','danger');return}msg(a?'Đã hiện dịch vụ.':'Đã ẩn dịch vụ.');load()}
async function del(sid){if(!confirm('Xóa dịch vụ #'+sid+'?'))return;const r=await fetch('/api/admin/services/'+sid,{method:'DELETE'}),d=await r.json();if(!r.ok){msg(d.error||'Xóa thất bại.','danger');return}msg('Đã xóa dịch vụ.');resetForm();load()}
async function logout(){await fetch('/api/logout',{method:'POST'});location='/login.html'}(async()=>{if(await check())load()})();
</script></body></html>
