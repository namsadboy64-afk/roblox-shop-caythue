<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nạp thẻ</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/style.css"></head>
<body><nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand fw-bold" href="/">ROBLOXSHOP</a><a class="btn btn-outline-light" href="/">Trang chủ</a></div></nav>
<div class="container py-5"><div class="page-card"><p class="section-tag">TOP UP</p><h1>Nạp thẻ</h1><div class="alert alert-warning">Bản này lưu yêu cầu nạp để admin kiểm tra. Chưa tự động xác thực thẻ và chưa kết nối cổng thẻ thật.</div>
<form id="topupForm" class="row g-3"><div class="col-md-6"><label>Nhà mạng</label><select name="provider" class="form-select"><option>Viettel</option><option>MobiFone</option><option>VinaPhone</option><option>Vietnamobile</option></select></div>
<div class="col-md-6"><label>Mệnh giá</label><select name="denomination" class="form-select"><option value="10000">10.000đ</option><option value="20000">20.000đ</option><option value="50000">50.000đ</option><option value="100000">100.000đ</option><option value="200000">200.000đ</option><option value="500000">500.000đ</option></select></div>
<div class="col-md-6"><input name="serial" class="form-control" placeholder="Số serial" required></div><div class="col-md-6"><input name="code" class="form-control" placeholder="Mã thẻ" required></div>
<div class="col-12"><button class="btn btn-primary">Gửi yêu cầu nạp</button></div></form><div id="msg" class="mt-3"></div></div></div><script src="/recharge.js"></script></body></html>
